services:
  mysql:
    image: mysql:8
    container_name: ${APPLICATION_NAME}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${CONTAINER_DB_PORT}:3306"
    volumes:
      - member_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - external-net
    mem_limit: 384MB

  member-service:
    image: ${DOCKER_IMAGE}:IMAGE_TAG_PLACEHOLDER
    container_name: ${APPLICATION_NAME}
    ports:
      - "${APPLICATION_PORT}:${APPLICATION_PORT}"
    environment:
      JAVA_OPTS: Xmx128m -Xms128m -XX:MaxMetaspaceSize=64m -Xss256k -XX:+UseSerialGC
    env_file:
      - .env
    networks:
      - external-net
    depends_on:
      - mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 512MB

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    env_file:
      - .env
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio_data:/data
    networks:
      - external-net
    mem_limit: 384MB

  minio-init: # minio bucket 생성 및 업로드/다운로드 권한 부여
    image: minio/mc
    container_name: init_minio
    env_file:
      - .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set $MINIO_ALIAS $MINIO_HOST:$MINIO_PORT $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD;
        mc mb $MINIO_ALIAS/$MINIO_BUCKET || true;
        mc anonymous set public $MINIO_ALIAS/$MINIO_BUCKET;
      "
    networks:
      - external-net

volumes:
  member_mysql_data:
  minio_data:

networks:
  external-net:
    external: true
    name: ${MMB_DOCKER_NETWORK}
